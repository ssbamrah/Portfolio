# SPR500 Lab 3 - Group 8 - Ansible inventory
# Control node: mgmt.group8.local (10.10.10.14), run as user "ubuntu".
# Hosts grouped by security zone; each zone maps to a VLAN.

[windows]
ad ansible_host=10.10.10.10

[windows:vars]
ansible_connection=winrm
ansible_port=5985
ansible_winrm_scheme=http
ansible_winrm_transport=ntlm
ansible_user=group8\Administrator
ansible_winrm_server_cert_validation=ignore
ansible_become=false

[infra]
dns-dhcp ansible_host=10.10.10.11
file     ansible_host=10.10.10.12
internal ansible_host=10.10.10.13
mgmt     ansible_host=10.10.10.14 ansible_connection=local

[dmz]
public     ansible_host=10.10.30.10
shop       ansible_host=10.10.30.11
dns-public ansible_host=10.10.30.12

# Routers (r1, r2) are hand-managed and intentionally not in this inventory.

[linux:children]
infra
dmz

[linux:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3

[clients]
admin ansible_host=172.16.0.2

[clients:vars]
ansible_connection=winrm
ansible_port=5985
ansible_winrm_scheme=http
ansible_winrm_transport=ntlm
ansible_user=group8\Administrator
ansible_winrm_server_cert_validation=ignore
ansible_become=false
