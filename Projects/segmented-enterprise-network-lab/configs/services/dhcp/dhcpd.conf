authoritative;
 
default-lease-time 28800;
max-lease-time 86400;
 
option domain-name "group8.local";
option domain-name-servers 10.10.10.11;
option domain-search "group8.local";
 
ddns-update-style none;
log-facility local7;
 
subnet 172.16.0.0 netmask 255.255.255.0 {
    range 172.16.0.20 172.16.0.200;
    option routers 172.16.0.1;
    option broadcast-address 172.16.0.255;
}
 
subnet 10.10.10.0 netmask 255.255.255.0 {
    option routers 10.10.10.1;
    option broadcast-address 10.10.10.255;
}
 
subnet 10.10.30.0 netmask 255.255.255.0 {
    option routers 10.10.30.1;
    option broadcast-address 10.10.30.255;
    option domain-name-servers 10.10.30.12;
}
 
host admin {
    hardware ethernet 00:0C:29:54:8C:C6;
    fixed-address 172.16.0.2;
    option host-name "admin";
}
 
host emp01 {
    hardware ethernet 00:0C:29:4F:28:C8;
    option host-name "emp01";
}
 
host ad {
    hardware ethernet 00:0C:29:B6:71:D5;
    fixed-address 10.10.10.10;
    option host-name "ad";
}
 
host file {
    hardware ethernet 00:50:56:39:B0:D9;
    fixed-address 10.10.10.12;
    option host-name "file";
}
 
host internal {
    hardware ethernet 00:50:56:24:E9:9A;
    fixed-address 10.10.10.13;
    option host-name "internal";
}

host mgmt {
    hardware ethernet 00:50:56:39:B0:10;
    fixed-address 10.10.10.14;
    option host-name "mgmt";
}

host public {
    hardware ethernet 00:0C:29:DF:A3:7C;
    fixed-address 10.10.30.10;
    option host-name "public";
}
 
host shop {
    hardware ethernet 00:50:56:36:AF:C0;
    fixed-address 10.10.30.11;
    option host-name "shop";
}
 
host dns-public {
    hardware ethernet 00:50:56:39:B0:D0;
    fixed-address 10.10.30.12;
    option host-name "dns-public";
}
