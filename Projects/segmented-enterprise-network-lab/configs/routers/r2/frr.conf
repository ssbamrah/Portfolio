frr defaults traditional
hostname r2
log syslog informational
service integrated-vtysh-config
!
! TRANSIT 192.168.8.192/30 VLAN 99 Area 0
interface vlan99
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 REPLACE_WITH_OSPF_MD5_KEY
!
! USERS 172.16.0.0/24 VLAN 10 Area 1
interface vlan10
 ip ospf area 1
 ip ospf passive
!
! INFRASTRUCTURE 10.10.10.0/24 VLAN 20 Area 2
interface vlan20
 ip ospf area 2
 ip ospf passive
!
router ospf
 ospf router-id 2.2.2.2
 area 0 authentication message-digest
!
