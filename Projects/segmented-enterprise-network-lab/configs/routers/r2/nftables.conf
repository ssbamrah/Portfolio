#!/usr/sbin/nft -f
# r2.group8 - internal router. Zero trust: default deny, explicit allows. No NAT.
flush ruleset

define USR_IF    = "vlan10"
define INF_IF    = "vlan20"
define TR_IF     = "vlan99"
define USERS     = 172.16.0.0/24
define INFRA     = 10.10.10.0/24
define DMZ       = 10.10.30.0/24
define LOCALNETS = { 172.16.0.0/24, 10.10.10.0/24, 10.10.30.0/24, 192.168.8.192/30 }
define R1        = 192.168.8.193
define R1_DMZ    = 10.10.30.1
define ADMIN     = 172.16.0.2
define MGMT      = 10.10.10.14
define AD        = 10.10.10.10
define DNSPRV    = 10.10.10.11
define FILESV    = 10.10.10.12
define INTWEB    = 10.10.10.13
define WEB       = { 10.10.30.10, 10.10.30.11 }
define DNSPUB    = 10.10.30.12
define AD_TCP    = { 53, 88, 135, 389, 445, 464, 636, 3268, 3269, 49152-65535 }
define AD_UDP    = { 53, 88, 123, 389, 464 }

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    udp dport 33434-33534 limit rate 10/second accept                    # traceroute to the router
    iifname $USR_IF udp sport 68 udp dport 67 accept                      # Users DHCP clients -> relay
    iifname $INF_IF ip saddr $DNSPRV udp sport 67 udp dport 67 accept     # dhcpd replies -> relay
    iifname $TR_IF ip saddr $R1 ip protocol 89 accept                     # OSPF from r1 only
    iifname { $USR_IF, $INF_IF } ip saddr { $ADMIN, $MGMT } tcp dport 22 accept   # SSH from admin + mgmt
    ip protocol icmp icmp type { echo-request, echo-reply, destination-unreachable, time-exceeded, parameter-problem } limit rate 10/second accept
    limit rate 5/second log prefix "R2-IN-DROP " level info
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    udp dport 33434-33534 limit rate 20/second accept                    # traceroute (Linux default)

    # Anti-spoofing
    iifname $USR_IF ip saddr != $USERS drop
    iifname $INF_IF ip saddr != $INFRA drop

    # r1's DMZ relay <-> dhcpd
    iifname $TR_IF ip saddr { $R1, $R1_DMZ } ip daddr $DNSPRV udp dport 67 accept
    ip saddr $DNSPRV ip daddr { $R1, $R1_DMZ } udp sport 67 accept

    # DMZ DHCP renewals (unicast to dhcpd). Remove if DMZ goes static.
    iifname $TR_IF ip saddr $DMZ ip daddr $DNSPRV udp sport 68 udp dport 67 accept

    # Nothing from the transit side (DMZ, External, Internet) may start connections inward
    iifname $TR_IF oifname { $USR_IF, $INF_IF } log prefix "R2-UNTRUSTED-DROP " drop

    # ICMP between trusted zones and outward
    ip protocol icmp icmp type { echo-request, echo-reply, destination-unreachable, time-exceeded, parameter-problem } limit rate 20/second accept

    # WinRM: mgmt -> AD and admin (Ansible Windows management)
    # (mgmt -> AD stays inside VLAN 20 and never reaches r2; kept for clarity)
    ip saddr $MGMT ip daddr $AD tcp dport 5985 accept
    ip saddr $MGMT ip daddr $ADMIN tcp dport 5985 accept

    # SSH: admin + mgmt -> every internal VM, the DMZ and r1
    ip saddr { $ADMIN, $MGMT } ip daddr $LOCALNETS tcp dport 22 accept
    # RDP: admin -> AD
    ip saddr $ADMIN ip daddr $AD tcp dport 3389 accept

    # Infra may not start connections to Users
    iifname $INF_IF oifname $USR_IF log prefix "R2-INFRA-USERS-DROP " drop

    # Users -> Infrastructure services
    iifname $USR_IF ip daddr $DNSPRV udp sport 68 udp dport 67 accept      # DHCP renewals

    iifname $USR_IF ip daddr $DNSPRV meta l4proto { tcp, udp } th dport 53 accept
    iifname $USR_IF ip daddr $AD tcp dport $AD_TCP accept
    iifname $USR_IF ip daddr $AD udp dport $AD_UDP accept
    iifname $USR_IF ip daddr $FILESV tcp dport { 139, 445 } accept
    iifname $USR_IF ip daddr $FILESV udp dport { 137, 138 } accept
    iifname $USR_IF ip daddr $INTWEB tcp dport { 80, 443 } accept

    # Users + Infra -> DMZ websites and public DNS
    oifname $TR_IF ip saddr { $USERS, $INFRA } ip daddr $WEB tcp dport { 80, 443 } accept
    oifname $TR_IF ip saddr { $USERS, $INFRA } ip daddr $DNSPUB meta l4proto { tcp, udp } th dport 53 accept

    # Users + Infra -> Internet (NAT on r1)
    oifname $TR_IF ip saddr { $USERS, $INFRA } ip daddr != $LOCALNETS tcp dport { 80, 443 } accept
    oifname $TR_IF ip saddr { $USERS, $INFRA } ip daddr != $LOCALNETS udp dport 123 accept

    limit rate 5/second log prefix "R2-FWD-DROP " level info
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}
