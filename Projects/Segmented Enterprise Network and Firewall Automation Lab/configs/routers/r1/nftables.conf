#!/usr/sbin/nft -f
# r1.group8 - edge router. Zero trust: default deny, explicit allows.
flush ruleset

define WAN      = "ens33"
define DMZ_IF   = "vlan30"
define TR_IF    = "vlan99"
define USERS    = 172.16.0.0/24
define INFRA    = 10.10.10.0/24
define DMZ      = 10.10.30.0/24
define TRANSIT  = 192.168.8.192/30
define R2       = 192.168.8.194
define ADMIN    = 172.16.0.2
define MGMT     = 10.10.10.14
define DNSPRV   = 10.10.10.11
define WEB      = { 10.10.30.10, 10.10.30.11 }
define DNSPUB   = 10.10.30.12

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    udp dport 33434-33534 limit rate 10/second accept                    # traceroute to the router
    iifname $DMZ_IF udp sport 68 udp dport 67 accept                      # DMZ DHCP clients -> relay
    iifname $TR_IF ip saddr $DNSPRV udp sport 67 udp dport 67 accept      # dhcpd replies -> relay
    iifname $WAN udp sport 67 udp dport 68 accept                         # WAN DHCP lease
    iifname $TR_IF ip saddr $R2 ip protocol 89 accept                     # OSPF from r2 only
    iifname $TR_IF ip saddr { $ADMIN, $MGMT } tcp dport 22 accept         # SSH from admin + mgmt
    ip protocol icmp icmp type { echo-request, echo-reply, destination-unreachable, time-exceeded, parameter-problem } limit rate 10/second accept
    limit rate 5/second log prefix "R1-IN-DROP " level info
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    udp dport 33434-33534 limit rate 20/second accept                    # traceroute (Linux default)

    # Anti-spoofing
    iifname $DMZ_IF ip saddr != $DMZ drop
    iifname $TR_IF ip saddr != { $USERS, $INFRA, $TRANSIT } drop
    iifname $WAN ip saddr { $USERS, $INFRA, $DMZ, $TRANSIT } drop

    # DMZ DHCP renewals (unicast to dhcpd). Remove if DMZ goes static.
    iifname $DMZ_IF ip daddr $DNSPRV udp sport 68 udp dport 67 accept

    # External and DMZ may never start connections into Users/Infra
    iifname $WAN oifname $TR_IF log prefix "R1-EXT-INTERNAL-DROP " drop
    iifname $DMZ_IF oifname $TR_IF log prefix "R1-DMZ-INTERNAL-DROP " drop

    # ICMP (everything not blocked above)
    ip protocol icmp icmp type { echo-request, echo-reply, destination-unreachable, time-exceeded, parameter-problem } limit rate 20/second accept

    # Anyone -> public websites and public DNS
    oifname $DMZ_IF ip daddr $WEB tcp dport { 80, 443 } accept
    oifname $DMZ_IF ip daddr $DNSPUB meta l4proto { tcp, udp } th dport 53 accept

    # SSH: admin + mgmt -> DMZ
    iifname $TR_IF oifname $DMZ_IF ip saddr { $ADMIN, $MGMT } tcp dport 22 accept

    # Internet egress
    oifname $WAN ip saddr { $USERS, $INFRA, $DMZ, $R2 } tcp dport { 80, 443 } accept
    oifname $WAN ip saddr { $USERS, $INFRA, $DMZ, $R2 } udp dport 123 accept
    oifname $WAN ip saddr $DNSPUB meta l4proto { tcp, udp } th dport 53 accept

    limit rate 5/second log prefix "R1-FWD-DROP " level info
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}

table ip nat {
  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    oifname $WAN masquerade
  }
}
